name: Verify TLS Renewal

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  SSH_HOST: 'www.ates-barberos.com'

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew certificate and verify Certbot timer
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/BarberAppointments
            chmod +x scripts/configure-tls-renewal.sh
            ./scripts/configure-tls-renewal.sh
            systemctl is-enabled --quiet certbot.timer
            systemctl is-active --quiet certbot.timer
