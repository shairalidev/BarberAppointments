name: Deploy BarberPro Application

on:
  push:
    branches:  themetry
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          set -e
          DEPLOY_START=$(date +%s)
          echo "🚀 Starting BarberAppointments Deployment..."
          echo "📅 Started at: $(date)"

          cd /var/www/BarberAppointments

          echo "🔧 Fixing ownership..."
          sudo chown -R ubuntu:ubuntu /var/www/BarberAppointments
          sudo chmod -R 755 /var/www/BarberAppointments

          echo "📥 Pulling latest code..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin themetry
          git reset --hard origin/themetry
          git clean -fd
          NEW_COMMIT=$(git rev-parse HEAD)

          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ] && [ -n "$OLD_COMMIT" ]; then
            echo "⚠️  No new changes detected. Skipping deployment."
            exit 0
          fi

          echo "📦 Checking dependency changes..."
          BACKEND_DEPS_CHANGED=false
          FRONTEND_DEPS_CHANGED=false

          if [ -n "$OLD_COMMIT" ]; then
            if git diff "$OLD_COMMIT" HEAD --name-only | grep -qE "backend/(package\.json|package-lock\.json)"; then
              BACKEND_DEPS_CHANGED=true
            fi
            if git diff "$OLD_COMMIT" HEAD --name-only | grep -qE "frontend/(package\.json|package-lock\.json)"; then
              FRONTEND_DEPS_CHANGED=true
            fi
          else
            BACKEND_DEPS_CHANGED=true
            FRONTEND_DEPS_CHANGED=true
          fi

          echo "🔧 Backend dependencies..."
          cd /var/www/BarberAppointments/backend
          if [ "$BACKEND_DEPS_CHANGED" = true ] || [ ! -d "node_modules" ]; then
            echo "   Installing backend packages (dependencies changed or missing)..."
            echo "   Checking files..."
            ls -la package*.json 2>/dev/null || echo "   ⚠️  No package files found!"
            if [ -f "package-lock.json" ]; then
              echo "   ✓ package-lock.json found, using npm ci..."
              npm ci --no-audit || {
                echo "   ⚠️  npm ci failed, trying npm install..."
                npm install --no-audit
              }
            else
              echo "   ⚠️  No package-lock.json, using npm install..."
              npm install --no-audit
            fi
            echo "   ✓ Backend dependencies installed"
          else
            echo "   ✓ Skipping backend npm install (no dependency changes)"
          fi

          echo "🟢 PM2 backend..."
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "   Installing pm2 globally..."
            sudo npm install -g pm2
          fi

          sudo mkdir -p /var/log/pm2 || true
          sudo chown -R ubuntu:ubuntu /var/log/pm2 || true

          cd /var/www/BarberAppointments
          set +e
          
          if pm2 list | grep -q "barberapp-backend"; then
            echo "   Restarting barberapp-backend..."
            pm2 restart barberapp-backend --update-env || pm2 delete barberapp-backend
          fi
          
          cd /var/www/BarberAppointments/backend
          if [ -f ".env.production" ]; then
            echo "   ✓ .env.production found"
          else
            echo "   ⚠️  .env.production not found!"
            ls -la *.env* 2>/dev/null || echo "   No .env files found"
          fi
          
          cd /var/www/BarberAppointments
          if ! pm2 list | grep -q "barberapp-backend"; then
            echo "   Starting barberapp-backend..."
            pm2 start ecosystem.config.js --env production
          fi
          
          set -e

          echo "🎨 Frontend dependencies..."
          cd /var/www/BarberAppointments/frontend
          if [ "$FRONTEND_DEPS_CHANGED" = true ] || [ ! -d "node_modules" ]; then
            echo "   Installing frontend packages (dependencies changed or missing)..."
            echo "   Checking files..."
            ls -la package*.json 2>/dev/null || echo "   ⚠️  No package files found!"
            if [ -f "package-lock.json" ]; then
              echo "   ✓ package-lock.json found, using npm ci..."
              npm ci --no-audit || {
                echo "   ⚠️  npm ci failed, trying npm install..."
                npm install --no-audit
              }
            else
              echo "   ⚠️  No package-lock.json, using npm install..."
              npm install --no-audit
            fi
            echo "   ✓ Frontend dependencies installed"
          else
            echo "   ✓ Skipping frontend npm install (no dependency changes)"
          fi

          echo "🏗️  Building frontend..."
          NODE_ENV=production npm run build -- --mode production

          # Generate cache-busting version
          VERSION=$(date +%s)
          echo "   Build version: $VERSION"

          # Update logo and assets with cache-busting
          if [ -f "dist/index.html" ]; then
            sed -i "s|/logo.png|/logo.png?v=$VERSION|g" dist/index.html
            echo "   ✓ Added cache-busting to logo"
          fi

          echo "🔐 Setting permissions..."
          sudo chown -R www-data:www-data dist
          sudo chmod -R 755 dist

          echo "📁 Ensuring uploads directory..."
          mkdir -p /var/www/BarberAppointments/backend/uploads
          sudo chown -R www-data:www-data /var/www/BarberAppointments/backend/uploads
          sudo chmod -R 755 /var/www/BarberAppointments/backend/uploads

          echo "💾 Saving PM2 state..."
          pm2 save

          echo "🧹 Clearing nginx cache..."
          sudo rm -rf /var/cache/nginx/* 2>/dev/null || true

          echo "🌐 Reloading nginx..."
          sudo nginx -t && sudo systemctl reload nginx || sudo systemctl restart nginx
          sudo systemctl status nginx --no-pager | head -5

          DEPLOY_END=$(date +%s)
          DEPLOY_DURATION=$((DEPLOY_END - DEPLOY_START))

          echo ""
          echo "✅ Deployment Complete!"
          echo "⏱️  Total time: ${DEPLOY_DURATION} seconds"
          echo "📅 Completed at: $(date)"
          echo ""
          echo "📊 PM2 Status:"
          pm2 status

    - name: Notify Success
      if: success()
      run: echo "Deployment Successful ✔"

    - name: Notify Failure
      if: failure()
      run: echo "Deployment Failed ❌"
