name: Deploy BarberPro Application

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          set -e
          echo "🚀 Starting BarberAppointments Deployment..."

          cd /var/www/BarberAppointments

          echo "🔧 Fixing ownership before deploy..."
          sudo chown -R ubuntu:ubuntu /var/www/BarberAppointments
          sudo chmod -R 755 /var/www/BarberAppointments

          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "📦 Backend dependencies..."
          cd backend
          npm ci

          echo "🟢 PM2 backend..."
          # ensure pm2 is available
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 not found — installing globally"
            sudo npm install -g pm2
          fi

          # Use a tolerant check so 'set -e' / script_stop don't abort the whole SSH script
          if pm2 pid barberapp-backend >/dev/null 2>&1; then
            echo "barberapp-backend found in pm2 — restarting"
            pm2 restart barberapp-backend || pm2 reload barberapp-backend || true
          else
            echo "barberapp-backend not found — starting via pm2"
            # Start the npm start script as a daemon under pm2
            pm2 start npm --name barberapp-backend -- run start
          fi

          echo "📦 Frontend dependencies..."
          cd ../frontend
          npm ci

          echo "🧹 Cleaning old dist..."
          rm -rf dist

          echo "🎨 Building frontend..."
          NODE_ENV=production npm run build

          echo "🔐 Fixing dist permissions..."
          sudo chown -R www-data:www-data dist
          sudo chmod -R 755 dist

          echo "📁 Ensuring uploads permissions..."
          mkdir -p /var/www/BarberAppointments/backend/uploads
          sudo chown -R www-data:www-data /var/www/BarberAppointments/backend/uploads
          sudo chmod -R 755 /var/www/BarberAppointments/backend/uploads

          echo "💾 Saving PM2 state..."
          pm2 save

          echo "🚦 Deployment Complete!"
          pm2 status

    - name: Health Check
      run: |
        sleep 5
        curl -f ${{ secrets.APP_URL }}/api/health || exit 1

    - name: Notify Success
      if: success()
      run: echo "Deployment Successful ✔"

    - name: Notify Failure
      if: failure()
      run: echo "Deployment Failed ❌"
