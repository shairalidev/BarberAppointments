name: Deploy BarberPro Application

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Navigate to project directory
          cd ${{ secrets.DEPLOY_PATH || '/var/www/barberpro' }}
          
          # Pull latest code
          echo "📥 Pulling latest code..."
          git pull origin main
          
          # Backend deployment
          echo "🔧 Setting up backend..."
          cd backend
          npm ci --production=false
          
          # Copy production environment file
          if [ -f .env.production ]; then
            cp .env.production .env
          fi
          
          # Stop existing PM2 process
          pm2 stop barberpro-backend || true
          pm2 delete barberpro-backend || true
          
          # Start backend with PM2
          echo "🚀 Starting backend with PM2..."
          NODE_ENV=production pm2 start server.js --name barberpro-backend --env production
          
          # Frontend deployment
          echo "🎨 Building frontend..."
          cd ../frontend
          npm ci
          
          # Build frontend for production
          npm run build
          
          # Copy built files to web server directory
          echo "📦 Deploying frontend build..."
          sudo rm -rf /var/www/html/barberpro/*
          sudo cp -r dist/* /var/www/html/barberpro/
          
          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/html/barberpro
          sudo chmod -R 755 /var/www/html/barberpro
          
          # Setup uploads directory
          cd ..
          mkdir -p backend/uploads
          sudo chown -R www-data:www-data backend/uploads
          sudo chmod -R 755 backend/uploads
          
          # Save PM2 configuration
          pm2 save
          
          # Show PM2 status
          echo "✅ Deployment complete!"
          pm2 status
          pm2 logs barberpro-backend --lines 20

    - name: Health Check
      run: |
        sleep 10
        curl -f ${{ secrets.APP_URL }}/api/health || exit 1

    - name: Notify Success
      if: success()
      run: echo "✅ Deployment successful!"

    - name: Notify Failure
      if: failure()
      run: echo "❌ Deployment failed!"
