name: Deploy BarberPro Application

on:
  push:
    branches:  themetry
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          set -e
          DEPLOY_START=$(date +%s)
          echo "🚀 Starting BarberAppointments Deployment..."

          cd /var/www/BarberAppointments
          sudo chown -R ubuntu:ubuntu /var/www/BarberAppointments
          sudo chmod -R 755 /var/www/BarberAppointments

          echo "📥 Pulling latest code..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin themetry
          git reset --hard origin/themetry
          git clean -fd
          NEW_COMMIT=$(git rev-parse HEAD)

          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ] && [ -n "$OLD_COMMIT" ]; then
            echo "⚠️  No new changes. Skipping deployment."
            exit 0
          fi

          # Check if dependencies changed
          BACKEND_NEED_INSTALL=false
          FRONTEND_NEED_INSTALL=false
          if [ -n "$OLD_COMMIT" ]; then
            git diff "$OLD_COMMIT" HEAD --name-only | grep -qE "backend/(package\.json|package-lock\.json)" && BACKEND_NEED_INSTALL=true || true
            git diff "$OLD_COMMIT" HEAD --name-only | grep -qE "frontend/(package\.json|package-lock\.json)" && FRONTEND_NEED_INSTALL=true || true
          else
            BACKEND_NEED_INSTALL=true
            FRONTEND_NEED_INSTALL=true
          fi

          # Backend
          echo "🔧 Backend..."
          cd backend
          if [ "$BACKEND_NEED_INSTALL" = true ] || [ ! -d "node_modules" ]; then
            [ -f "package-lock.json" ] && npm ci --no-audit || npm install --no-audit
          fi

          # PM2
          command -v pm2 >/dev/null || sudo npm install -g pm2
          sudo mkdir -p /var/log/pm2
          sudo chown -R ubuntu:ubuntu /var/log/pm2

          cd /var/www/BarberAppointments
          pm2 list | grep -q "barberapp-backend" && pm2 restart barberapp-backend --update-env || pm2 start ecosystem.config.js --env production

          # Frontend
          echo "🎨 Frontend..."
          cd frontend
          if [ "$FRONTEND_NEED_INSTALL" = true ] || [ ! -d "node_modules" ]; then
            [ -f "package-lock.json" ] && npm ci --no-audit || npm install --no-audit
          fi

          echo "🏗️  Building..."
          NODE_ENV=production npm run build -- --mode production

          # Cache busting
          VERSION=$(date +%s)
          [ -f "dist/index.html" ] && sed -i "s|/logo.png|/logo.png?v=$VERSION|g" dist/index.html

          # Permissions
          sudo chown -R www-data:www-data dist
          sudo chmod -R 755 dist
          mkdir -p /var/www/BarberAppointments/backend/uploads
          sudo chown -R www-data:www-data /var/www/BarberAppointments/backend/uploads

          # Nginx
          pm2 save
          sudo rm -rf /var/cache/nginx/* 2>/dev/null || true
          sudo systemctl reload nginx

          DEPLOY_DURATION=$(($(date +%s) - DEPLOY_START))
          echo "✅ Deployment Complete! (${DEPLOY_DURATION}s)"
          pm2 status

    - name: Notify Success
      if: success()
      run: echo "Deployment Successful ✔"

    - name: Notify Failure
      if: failure()
      run: echo "Deployment Failed ❌"
