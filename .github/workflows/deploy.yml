name: Deploy BarberPro Application

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script_stop: true
        script: |
          set -e
          echo "Starting BarberPro Deployment Pipeline..."

          cd /var/www/BarberAppointments

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing backend despendencies..."
          cd backend
          npm ci

          echo "Ensuring PM2 backend process exists..."
          if pm2 describe barberpro-backend > /dev/null; then
            pm2 restart barberpro-backend
          else
            NODE_ENV=production pm2 start server.js --name barberpro-backend
          fi

          echo "Installing frontend dependencies..."
          cd ../frontend
          npm ci

          echo "Building frontend..."
          npm run build

          echo "Deploying frontend to /var/www/html/BarberAppointments..."
          sudo mkdir -p /var/www/html/BarberAppointments
          sudo rm -rf /var/www/html/BarberAppointments/*
          sudo cp -r dist/* /var/www/html/BarberAppointments/

          echo "Setting permissions..."
          sudo chown -R www-data:www-data /var/www/html/BarberAppointments
          sudo chmod -R 755 /var/www/html/BarberAppointments

          echo "Saving PM2 state..."
          pm2 save

          echo "Deployment finished. PM2 Status:"
          pm2 status

    - name: Health Check
      run: |
        sleep 5
        curl -f ${{ secrets.APP_URL }}/api/health || exit 1

    - name: Notify Success
      if: success()
      run: echo "Deployment Successful ✔"

    - name: Notify Failure
      if: failure()
      run: echo "Deployment Failed ❌"
