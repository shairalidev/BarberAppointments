name: Deploy BarberPro Application

on:
  push:
    branches:  themetry
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          set -e
          echo "🚀 Starting BarberAppointments Deployment..."

          cd /var/www/BarberAppointments

          echo "🔧 Fixing ownership before deploy..."
          sudo chown -R ubuntu:ubuntu /var/www/BarberAppointments
          sudo chmod -R 755 /var/www/BarberAppointments

          echo "📥 Pulling latest code..."
          git fetch origin themetry
          git reset --hard origin/themetry
          git clean -fd

          echo "📦 Backend dependencies..."
          cd backend
          rm -rf node_modules package-lock.json
          npm install

          echo "🟢 PM2 backend..."
          # ensure pm2 is available
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 not found — installing globally"
            sudo npm install -g pm2
          fi

          # Use ecosystem file for production deployment
          cd /var/www/BarberAppointments
          
          # Check if barberapp-backend exists in pm2
          if pm2 list | grep -q "barberapp-backend"; then
            echo "barberapp-backend found in pm2 — restarting with production env"
            pm2 restart ecosystem.config.js --env production
          else
            echo "barberapp-backend not found — starting with production env"
            pm2 start ecosystem.config.js --env production
          fi

          echo "📦 Frontend dependencies..."
          cd ../frontend
          rm -rf node_modules package-lock.json dist
          npm install

          echo "🎨 Building frontend..."
          NODE_ENV=production npm run build -- --mode production

          echo "🔐 Fixing dist permissions..."
          sudo chown -R www-data:www-data dist
          sudo chmod -R 755 dist

          echo "📁 Ensuring uploads permissions..."
          mkdir -p /var/www/BarberAppointments/backend/uploads
          sudo chown -R www-data:www-data /var/www/BarberAppointments/backend/uploads
          sudo chmod -R 755 /var/www/BarberAppointments/backend/uploads

          echo "💾 Saving PM2 state..."
          pm2 save

          echo "🌐 Restarting nginx..."
          sudo systemctl restart nginx
          sudo systemctl status nginx --no-pager

          echo "🚦 Deployment Complete!"
          pm2 status

    - name: Notify Success
      if: success()
      run: echo "Deployment Successful ✔"

    - name: Notify Failure
      if: failure()
      run: echo "Deployment Failed ❌"
