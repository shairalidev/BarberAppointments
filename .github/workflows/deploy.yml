name: Deploy BarberPro Application

on:
  push:
    branches: themetry
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  # The apex currently resolves to a different host where SSH is unreachable.
  SSH_HOST: 'www.ates-barberos.com'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Hostinger VPS

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 📥 Pull Latest Code on Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          cd /var/www/BarberAppointments
          chown -R root:root /var/www/BarberAppointments
          chmod -R 755 /var/www/BarberAppointments
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin themetry
          git reset --hard origin/themetry
          git clean -fd
          NEW_COMMIT=$(git rev-parse HEAD)
          echo "OLD=$OLD_COMMIT" > /tmp/deploy_state
          echo "NEW=$NEW_COMMIT" >> /tmp/deploy_state
          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ] && [ -n "$OLD_COMMIT" ]; then
            echo "NO_CHANGES=true" >> /tmp/deploy_state
          fi

    - name: Maintain TLS certificate and renewal timer
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          cd /var/www/BarberAppointments
          chmod +x scripts/configure-tls-renewal.sh
          ./scripts/configure-tls-renewal.sh

    - name: 🔧 Install Backend Dependencies
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then echo "⚠️ No changes, skipping."; exit 0; fi

          cd /var/www/BarberAppointments/backend

          if [ ! -f ".env" ]; then
            echo "❌ .env file missing! Aborting."
            exit 1
          fi

          NEED_INSTALL=false
          if [ -n "$OLD" ]; then
            git diff "$OLD" "$NEW" --name-only | grep -qE "backend/(package\.json|package-lock\.json)" && NEED_INSTALL=true || true
          else
            NEED_INSTALL=true
          fi

          if [ "$NEED_INSTALL" = true ] || [ ! -d "node_modules" ]; then
            echo "📦 Installing backend dependencies..."
            [ -f "package-lock.json" ] && npm ci --no-audit || npm install --no-audit
          else
            echo "✅ No dependency changes, skipping install."
          fi

    - name: ♻️ Restart Backend with PM2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then echo "⚠️ No changes, skipping."; exit 0; fi

          command -v pm2 >/dev/null || npm install -g pm2
          mkdir -p /var/log/pm2
          chown -R root:root /var/log/pm2

          cd /var/www/BarberAppointments
          pm2 list | grep -q "barberapp-backend" \
            && pm2 restart barberapp-backend --update-env \
            || pm2 start ecosystem.config.js --env production

          pm2 save
          pm2 status

    - name: 🎨 Install Frontend Dependencies
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then echo "⚠️ No changes, skipping."; exit 0; fi

          cd /var/www/BarberAppointments/frontend

          NEED_INSTALL=false
          if [ -n "$OLD" ]; then
            git diff "$OLD" "$NEW" --name-only | grep -qE "frontend/(package\.json|package-lock\.json)" && NEED_INSTALL=true || true
          else
            NEED_INSTALL=true
          fi

          if [ "$NEED_INSTALL" = true ] || [ ! -d "node_modules" ]; then
            echo "📦 Installing frontend dependencies..."
            [ -f "package-lock.json" ] && npm ci --no-audit || npm install --no-audit
          else
            echo "✅ No dependency changes, skipping install."
          fi

    - name: 🏗️ Build Frontend
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then echo "⚠️ No changes, skipping."; exit 0; fi

          cd /var/www/BarberAppointments/frontend
          NODE_ENV=production npm run build -- --mode production

          # Cache busting
          VERSION=$(date +%s)
          [ -f "dist/index.html" ] && sed -i "s|/logo.png|/logo.png?v=$VERSION|g" dist/index.html

          # Permissions
          chown -R www-data:www-data dist
          chmod -R 755 dist
          mkdir -p /var/www/BarberAppointments/backend/uploads
          chown -R www-data:www-data /var/www/BarberAppointments/backend/uploads

    - name: 🌐 Reload Nginx
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then echo "⚠️ No changes, skipping."; exit 0; fi

          rm -rf /var/cache/nginx/* 2>/dev/null || true
          systemctl reload nginx
          echo "✅ Nginx reloaded successfully"

    - name: ✅ Deployment Summary
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          source /tmp/deploy_state || true
          if [ "${NO_CHANGES}" = "true" ]; then
            echo "⚠️ No changes detected. Deployment skipped."
          else
            echo "🎉 Deployment Complete!"
            echo "📍 Commit: $NEW"
            pm2 status
          fi
          rm -f /tmp/deploy_state

    - name: 🔴 Notify Failure
      if: failure()
      run: echo "❌ Deployment Failed here — check logs above"
